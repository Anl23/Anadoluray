<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bakım Çalışması | AnadoluRay Arşivi</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}
body{
background:#f5f5f5;
color:#222;
display:flex;
height:100vh;
align-items:center;
justify-content:center;
padding:20px;
}
.box{
background:white;
padding:40px;
border-radius:12px;
border:1px solid #ddd;
max-width:480px;
width:100%;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}
.logo{
font-size:22px;
font-weight:700;
margin-bottom:15px;
color:#000;
}
.logo-divider{
width:100%;
height:1px;
background-color:#eef0f2;
margin-bottom:25px;
}
h1{
font-size:20px;
margin-bottom:10px;
color:#333;
}
p{
font-size:14px;
color:#666;
line-height:1.6;
}
</style>
</head>
<body>
<div class="box">
<div class="logo">AnadoluRay Arşivi</div>
<div class="logo-divider"></div>
<h1>🛠️ Sistem Bakımda</h1>
<p>Sitemizin revizyon çalışmaları devam etmektedir, yakın zamanda erişime açılacaktır.</p>
</div>
</body>
</html>
