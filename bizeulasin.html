<main class="content contact-content">
<section class="contact-panel">
<h1>Bize Ulaşın</h1>
<p class="contact-intro">Öneri, düzeltme veya görüşlerinizi bizimle paylaşabilirsiniz.</p>

<div id="form-success" class="form-message form-success" aria-live="polite"></div>
<div id="form-error" class="form-message form-error" aria-live="polite"></div>

<form class="contact-form" id="contact-form" action="https://formspree.io/f/xjyvedbr" method="POST">
<div class="form-field">
<label for="isim">İsminiz</label>
<input type="text" id="isim" name="isim" autocomplete="name" required>
<span class="field-error" aria-live="polite">Bu alan boş bırakılamaz.</span>
</div>

<div class="form-field">
<label for="email">E-posta Adresiniz</label>
<input type="email" id="email" name="email" autocomplete="email" required>
<span class="field-error" aria-live="polite">Bu alan boş bırakılamaz.</span>
</div>

<div class="form-field">
<label for="mesaj">Mesajınız</label>
<textarea id="mesaj" name="mesaj" rows="7" required></textarea>
<span class="field-error" aria-live="polite">Bu alan boş bırakılamaz.</span>
</div>

<button type="submit" id="submit-btn">Mesajı Gönder</button>
</form>
</section>
</main>

<script src="js/script.js"></script>
</body>
